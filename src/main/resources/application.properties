spring.application.name=livechat

# --- Base de donnees MySQL (creer la base : CREATE DATABASE livechat;) ---
spring.datasource.url=jdbc:mysql://localhost:3306/livechat
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Serveur HTTPS (TLS, certificat auto-signé src/main/resources/keystore.p12) ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeme2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=livechat
